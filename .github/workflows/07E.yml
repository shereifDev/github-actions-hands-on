name: Exercise 7 

on: 
  workflow_dispatch: 

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Clone my repo 
        uses: actions/checkout@v7.0.1
        
      - name: compile the C code 
        run: gcc ./usedFiles/main.c  -o ./usedFiles/app 
        
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: upload my compiled code 
          path: ./usedFiles/app 
          warn: there is no file called app in this path 
